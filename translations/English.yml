captainvalheim_shield_tooltip: "Shield strikes and throws require <color=orange>an empty right hand</color>. Controls appear in the key hints while equipped."
captainvalheim_shield_tooltip_note: "Server settings control charge, reflection, and block-charge counterattacks with a one-handed melee weapon. See <color=orange>Shield Techniques</color> in the Compendium. Each feature also requires the shield's settings to enable it."
captainvalheim_hint_charge: "Charge"
captainvalheim_hint_attack: "Strike"
captainvalheim_hint_throw: "Throw"
captainvalheim_shield_charge_cooldown_name: "Shield Charge Cooldown"
captainvalheim_shield_charge_cooldown_tooltip: "Shield Charge is recharging."

captainvalheim_compendium_title: "Shield Techniques"
captainvalheim_compendium_intro: "Equip a shield in the left hand. Shield Strike and Throw require an empty right hand. Server settings separately allow Shield Charge, Projectile Reflection, and Block Charge with a one-handed melee weapon. Each feature must also be enabled for the shield."
captainvalheim_compendium_group_active: "Active Attacks"
captainvalheim_compendium_group_defensive: "Defensive Techniques"

captainvalheim_compendium_primary_attack_name: "Shield Strike"
captainvalheim_compendium_primary_attack_description: "Press Primary Attack with your right hand empty to strike at close range. Damage and push scale with the shield, and the attack uses the Blocking skill."
captainvalheim_compendium_throw_name: "Shield Throw"
captainvalheim_compendium_throw_description: "With your right hand empty, press Secondary Attack while not blocking to throw the shield. It can ricochet between enemies with diminishing damage before returning."
captainvalheim_compendium_charge_name: "Shield Charge"
captainvalheim_compendium_charge_description: "Hold Block and press Secondary Attack to rush forward. The first enemy or obstacle stops the charge and triggers a shield-scaled impact. This also works with a one-handed melee weapon if the server permits it. While blocking, an attempted charge takes priority over the weapon's secondary attack, even if the charge cannot start."
captainvalheim_compendium_reflect_name: "Projectile Reflection"
captainvalheim_compendium_reflect_description: "While blocking, blockable projectiles can be reflected toward your aim point. Stamina cost, reflected damage, and push depend on shield deflection and configuration. Use with a one-handed melee weapon requires server permission."
captainvalheim_compendium_block_charge_name: "Block Charge"
captainvalheim_compendium_block_charge_description: "Blocking an attack builds Valheim's native block charges. Reaching the shield's charge limit automatically releases a counterattack. Use with a one-handed melee weapon requires server permission. Equipping an item that is not allowed, or disabling this feature, clears stored charges."

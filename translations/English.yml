captainvalheim_shield_tooltip: "<color=orange>Empty your right hand</color> to use shield attacks; controls appear in the key hints below while equipped."
captainvalheim_shield_tooltip_note: "See <color=orange>Shield Techniques</color> in the Compendium for all features. Availability depends on shield and server settings."
captainvalheim_hint_charge: "Charge"
captainvalheim_hint_attack: "Strike"
captainvalheim_hint_throw: "Throw"
captainvalheim_shield_charge_cooldown_name: "Shield Charge Cooldown"
captainvalheim_shield_charge_cooldown_tooltip: "Shield Charge is recharging."

captainvalheim_compendium_title: "Shield Techniques"
captainvalheim_compendium_intro: "Shield Strike, Throw, and Charge require a shield in the left hand and an empty right hand. Projectile Reflection and Block Charge also work with a right-hand weapon. Availability depends on shield and server settings."
captainvalheim_compendium_group_active: "Active Attacks — Right Hand Empty"
captainvalheim_compendium_group_defensive: "Defensive Techniques"

captainvalheim_compendium_primary_attack_name: "Shield Strike"
captainvalheim_compendium_primary_attack_description: "Press Primary Attack with your right hand empty to strike at close range. Damage and push scale with the shield, and the attack uses the Blocking skill."
captainvalheim_compendium_throw_name: "Shield Throw"
captainvalheim_compendium_throw_description: "With your right hand empty, press Secondary Attack while not blocking to throw the shield. It can ricochet between enemies with diminishing damage before returning."
captainvalheim_compendium_charge_name: "Shield Charge"
captainvalheim_compendium_charge_description: "With your right hand empty, hold Block and press Secondary Attack to rush forward. The first enemy or obstacle stops the charge and triggers a shield-scaled impact."
captainvalheim_compendium_reflect_name: "Projectile Reflection"
captainvalheim_compendium_reflect_description: "While blocking, blockable projectiles can be reflected toward your aim point. Stamina cost, reflected damage, and push depend on shield deflection and configuration."
captainvalheim_compendium_block_charge_name: "Block Charge"
captainvalheim_compendium_block_charge_description: "Blocking an attack builds Valheim's native block charges. Reaching the shield's charge limit automatically releases a counterattack."

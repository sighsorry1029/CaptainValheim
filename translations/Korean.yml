captainvalheim_shield_tooltip: "방패 타격과 투척은 <color=orange>오른손을 비워야</color> 사용할 수 있습니다. 조작은 장착 중 키 힌트에 표시됩니다."
captainvalheim_shield_tooltip_note: "한손 근접 무기와 함께 사용하는 돌진·반사·방어 충전 반격은 서버 설정으로 허용합니다. Compendium의 <color=orange>방패 기술</color>에서 확인하세요. 각 기능은 해당 방패 설정에서도 활성화되어야 합니다."
captainvalheim_hint_charge: "돌진"
captainvalheim_hint_attack: "타격"
captainvalheim_hint_throw: "투척"
captainvalheim_shield_charge_cooldown_name: "방패 돌진 재사용 대기시간"
captainvalheim_shield_charge_cooldown_tooltip: "방패 돌진이 재충전 중입니다."

captainvalheim_compendium_title: "방패 기술"
captainvalheim_compendium_intro: "왼손에 방패를 장착하세요. 방패 타격과 투척은 오른손을 비워야 합니다. 한손 근접 무기를 든 상태의 방패 돌진·투사체 반사·방어 충전은 서버에서 각각 허용할 수 있습니다. 각 기능은 해당 방패 설정에서도 활성화되어야 합니다."
captainvalheim_compendium_group_active: "능동 공격"
captainvalheim_compendium_group_defensive: "방어 기능"

captainvalheim_compendium_primary_attack_name: "방패 타격"
captainvalheim_compendium_primary_attack_description: "오른손을 비우고 기본 공격을 누르면 근거리에서 방패로 타격합니다. 피해와 밀쳐내기는 방패 능력치에 비례하며 방어 스킬을 사용합니다."
captainvalheim_compendium_throw_name: "방패 투척"
captainvalheim_compendium_throw_description: "오른손을 비운 상태에서 방어하지 않고 보조 공격을 누르면 방패를 던집니다. 방패는 피해가 감소하며 여러 적에게 튕긴 뒤 돌아옵니다."
captainvalheim_compendium_charge_name: "방패 돌진"
captainvalheim_compendium_charge_description: "방어하며 보조 공격을 누르면 앞으로 돌진합니다. 처음 부딪힌 적이나 장애물에서 멈추고 방패 능력치에 비례한 충격을 줍니다. 서버가 허용하면 한손 근접 무기를 든 상태에서도 사용할 수 있습니다. 방어 중 시도한 돌진은 무기 보조 공격보다 우선하며, 돌진을 시작할 수 없어도 무기 보조 공격으로 전환되지 않습니다."
captainvalheim_compendium_reflect_name: "투사체 반사"
captainvalheim_compendium_reflect_description: "방어 중 막을 수 있는 투사체를 조준 지점으로 반사할 수 있습니다. 스태미나 비용과 반사 피해·밀쳐내기는 방패의 반사력 및 설정에 따라 달라집니다. 한손 근접 무기와 함께 사용하려면 서버에서 허용해야 합니다."
captainvalheim_compendium_block_charge_name: "방어 충전"
captainvalheim_compendium_block_charge_description: "공격을 방어할 때 Valheim의 기본 방어 충전이 쌓입니다. 방패의 최대 충전에 도달하면 자동으로 반격합니다. 한손 근접 무기와 함께 사용하려면 서버에서 허용해야 합니다. 허용되지 않은 장비를 들거나 기능을 비활성화하면 쌓인 충전은 초기화됩니다."
